<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <title>Studio HyperFrames smoke</title>
  <style>
    html, body { margin: 0; width: 1920px; height: 1080px; overflow: hidden; background: #0f172a; color: #f8fafc; font-family: system-ui, sans-serif; }
    #card { position: absolute; inset: 0; display: flex; align-items: center; justify-content: center; flex-direction: column; }
    h1 { font-size: 72px; margin: 0; }
    p { font-size: 32px; opacity: 0.85; }
  </style>
</head>
<body>
  <div id="card">
    <h1 id="title">Studio</h1>
    <p id="sub">HyperFrames 10s smoke</p>
  </div>
  <script src="https://cdn.jsdelivr.net/npm/gsap@3.12.5/dist/gsap.min.js"></script>
  <script>
    gsap.from("#title", { y: 40, opacity: 0, duration: 1.2 });
    gsap.from("#sub", { y: 20, opacity: 0, duration: 1.2, delay: 0.3 });
  </script>
</body>
</html>
